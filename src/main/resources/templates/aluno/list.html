<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Lista de Alunos</title>
</head>
<body>

    <div layout:fragment="conteudo">
        <div class="card mt-4">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Alunos Cadastrados</h4>
                <a th:href="@{/admin/aluno/form}" class="btn btn-light btn-sm">Novo Aluno</a>
            </div>
            
            <div class="card-body">
                
                <div th:if="${mensagem}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${mensagem}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Matrícula</th> 
                                <th>Curso</th>
                                <th>Fone</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="aluno : ${alunos}">
                                <td th:text="${aluno.id}">1</td>
                                <td th:text="${aluno.nome}">Nome do Aluno</td>
                                <td th:text="${aluno.matricula}">2024001</td>
                                <td th:text="${aluno.curso?.nome}">Curso</td>
                                <td th:text="${aluno.fone}">(83) 9999-9999</td>
                                
                                <td>
                                    <div class="d-flex gap-2">
                                        <a th:href="@{/admin/aluno/id/{id}(id=${aluno.id})}" class="btn btn-sm btn-outline-primary">
                                            Editar
                                        </a>

                                        <form th:action="@{/admin/aluno/delete/{matricula}(matricula=${aluno.matricula})}"
                                            method="post" style="display: inline;" 
                                            onsubmit="return confirm('Tem certeza que deseja excluir este aluno?');">
                                            <input type="hidden" name="_method" value="delete">
                                            <button class="btn btn-sm btn-outline-danger">Excluir</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            
                            <tr th:if="${#lists.isEmpty(alunos)}">
                                <td colspan="6" class="text-center text-muted py-3">
                                    Nenhum aluno cadastrado no sistema.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <nav th:if="${navPage != null and navPage.totalPages > 1}" aria-label="Navegação de página" class="mt-4">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${navPage.currentPage == 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/aluno/list(page=${navPage.currentPage - 1})}">Anterior</a>
                        </li>

                        <li th:each="pageNum : ${#numbers.sequence(1, navPage.totalPages)}" 
                            class="page-item" th:classappend="${pageNum == navPage.currentPage} ? 'active'">
                            <a class="page-link" th:href="@{/admin/aluno/list(page=${pageNum})}" th:text="${pageNum}"></a>
                        </li>

                        <li class="page-item" th:classappend="${navPage.currentPage == navPage.totalPages} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/aluno/list(page=${navPage.currentPage + 1})}">Próximo</a>
                        </li>
                    </ul>
                </nav>

            </div>
        </div>
    </div>

</body>
</html>
