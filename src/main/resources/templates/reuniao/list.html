<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/base}">

<head>
    <title>Gerenciar Reuniões</title>
</head>

<body>

    <div layout:fragment="conteudo">
        <div class="card mt-4">

            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="bi bi-calendar-week"></i> Reuniões do Colegiado</h4>
                <a th:href="@{/reunioes/form}" class="btn btn-outline-light btn-sm fw-bold">
                    <i class="bi bi-plus-lg"></i> Nova Reunião
                </a>
            </div>

            <div class="card-body">

                <div th:if="${mensagem}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill"></i> <span th:text="${mensagem}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${erro}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="card bg-light mb-4 border-light">
                    <div class="card-body py-3">
                        <form method="get" th:action="@{/reunioes}" class="row g-3 align-items-end">

                            <input type="hidden" name="colegiadoId" value="1" />

                            <div class="col-md-4">
                                <label for="status" class="form-label small fw-bold text-secondary">Filtrar por
                                    Status</label>
                                <select class="form-select" id="status" name="status">
                                    <option value="">Todas as reuniões</option>
                                    <option
                                        th:each="s : ${T(br.edu.ifpb.pweb2.primeiraturmadostf.model.StatusReuniao).values()}"
                                        th:value="${s}" th:text="${s.descricao}"
                                        th:selected="${statusSelecionado != null and statusSelecionado.name() == s.name()}">
                                        Status
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-3 d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-funnel"></i> Filtrar
                                </button>

                                <a th:if="${statusSelecionado != null}" th:href="@{/reunioes}"
                                    class="btn btn-outline-secondary">
                                    <i class="bi bi-x-lg"></i> Limpar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Data</th>
                                <th>Colegiado</th>
                                <th>Status</th>
                                <th class="text-center">Pauta</th>
                                <th class="text-end pe-3">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(reunioes)}">
                                <td colspan="5" class="text-center text-muted py-5">
                                    <div class="d-flex flex-column align-items-center">
                                        <i class="bi bi-calendar-x display-4 mb-2 opacity-50"></i>
                                        <span>Nenhuma reunião encontrada.</span>
                                    </div>
                                </td>
                            </tr>

                            <tr th:each="r : ${reunioes}">
                                <td>
                                    <div class="d-flex flex-column">
                                        <span class="fw-bold fs-5"
                                            th:text="${#temporals.format(r.dataReuniao, 'dd')}">01</span>
                                        <span class="small text-uppercase text-muted"
                                            th:text="${#temporals.format(r.dataReuniao, 'MMM/yyyy')}">JAN/2025</span>
                                    </div>
                                </td>

                                <td>
                                    <div class="fw-bold text-dark" th:text="${r.colegiado?.curso?.nome}">Sistemas</div>
                                    <small class="text-muted" th:text="${r.colegiado?.portaria}">Portaria 123</small>
                                </td>

                                <td>
                                    <span class="badge rounded-pill"
                                        th:classappend="${r.status.name() == 'PROGRAMADA' ? 'bg-primary' : 'bg-secondary'}"
                                        th:text="${r.status.descricao}">
                                        Programada
                                    </span>
                                </td>

                                <td class="text-center">
                                    <span class="badge bg-light text-dark border">
                                        <i class="bi bi-file-earmark-text me-1"></i>
                                        <span th:text="${r.processos != null ? r.processos.size() : 0} + ' Processos'">0
                                            Processos</span>
                                    </span>
                                </td>

                                <td class="text-end pe-3">
                                    <div class="btn-group">

                                        <a th:if="${r.status.name() == 'PROGRAMADA'}"
                                            th:href="@{/reunioes/{id}/iniciar(id=${r.id})}"
                                            class="btn btn-sm btn-success fw-bold">
                                            <i class="bi bi-play-fill"></i> Iniciar
                                        </a>

                                        <button type="button"
                                            class="btn btn-sm btn-success dropdown-toggle dropdown-toggle-split"
                                            data-bs-toggle="dropdown" aria-expanded="false">
                                            <span class="visually-hidden">Opções</span>
                                        </button>

                                        <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                                            <li>
                                                <button type="button" class="dropdown-item"
                                                    th:onclick="'carregarDetalhes(' + ${r.id} + ')'">
                                                    <i class="bi bi-eye me-2"></i> Ver Detalhes
                                                </button>
                                            </li>

                                            <li th:if="${r.status.name() == 'ENCERRADA'}">
                                                <a class="dropdown-item" th:href="@{/reunioes/{id}/ata(id=${r.id})}">
                                                    <i class="bi bi-file-pdf me-2"></i> Visualizar Ata
                                                </a>
                                            </li>

                                            <li>
                                                <hr class="dropdown-divider">
                                            </li>

                                            <li th:if="${r.status.name() == 'PROGRAMADA'}">
                                                <form th:action="@{/reunioes/delete/{id}(id=${r.id})}" method="post"
                                                    onsubmit="return confirm('Excluir esta reunião?');">
                                                    <button type="submit" class="dropdown-item text-danger">
                                                        <i class="bi bi-trash me-2"></i> Cancelar Reunião
                                                    </button>
                                                </form>
                                            </li>
                                        </ul>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modalDetalhes" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content shadow-lg border-0" id="conteudoModal">
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            function carregarDetalhes(id) {
                // O Thymeleaf vai renderizar isso como '/primeiraturmadostf/reunioes/'
                const baseUrl = /*[[@{/reunioes/}]]*/ '/reunioes/';
                const url = baseUrl + id + '/detalhes';

                fetch(url)
                    .then(response => {
                        if (!response.ok) throw new Error('Erro 404: Verifique o mapeamento do Controller');
                        return response.text();
                    })
                    .then(html => {
                        document.getElementById('conteudoModal').innerHTML = html;
                        const modal = new bootstrap.Modal(document.getElementById('modalDetalhes'));
                        modal.show();
                    })
                    .catch(error => {
                        console.error(error);
                        alert('Erro ao carregar detalhes: ' + error.message);
                    });
            }
        </script>

    </div>
</body>

</html>
