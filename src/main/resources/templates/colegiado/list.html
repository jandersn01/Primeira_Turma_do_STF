<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Lista de Colegiados</title>
</head>
<body>

    <div layout:fragment="conteudo">
        <div class="card mt-4">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Colegiados Cadastrados</h4>
                <a th:href="@{/admin/colegiado/form}" class="btn btn-light btn-sm">Novo Colegiado</a>
            </div>
            
            <div class="card-body">
                
                <div th:if="${mensagem}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${mensagem}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Curso</th>
                                <th>Portaria</th>
                                <th>Vigência (Início - Fim)</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="colegiado : ${colegiados}">
                                <td th:text="${colegiado.id}">1</td>
                                
                                <td class="fw-bold">
                                    <a th:href="@{/admin/colegiado/id/{id}(id=${colegiado.id})}" 
                                       th:text="${colegiado.curso?.nome}" class="text-decoration-none text-dark">
                                    </a>
                                </td>
                                
                                <td th:text="${colegiado.portaria}">Portaria 123/2024</td>
                                
                                <td>
                                    <span th:text="${#temporals.format(colegiado.dataInicio, 'dd/MM/yyyy')}">01/01/2024</span>
                                    <span th:if="${colegiado.dataFim != null}">
                                        a <span th:text="${#temporals.format(colegiado.dataFim, 'dd/MM/yyyy')}">31/12/2025</span>
                                    </span>
                                    <span th:if="${colegiado.dataFim == null}" class="badge bg-success">Ativo</span>
                                </td>
                                
                                <td>
                                    <div class="d-flex gap-2">
                                        <a th:href="@{/admin/colegiado/id/{id}(id=${colegiado.id})}" class="btn btn-sm btn-outline-primary">
                                            Editar
                                        </a>

                                        <form th:action="@{/admin/colegiado/delete/{id}(id=${colegiado.id})}"
                                              method="post" style="display: inline;" 
                                              onsubmit="return confirm('Tem certeza que deseja excluir este colegiado?');">
                                            <button class="btn btn-sm btn-outline-danger">Excluir</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            
                            <tr th:if="${#lists.isEmpty(colegiados)}">
                                <td colspan="5" class="text-center text-muted py-3">
                                    Nenhum colegiado cadastrado no sistema.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <nav th:if="${navPage != null and navPage.totalPages > 1}" aria-label="Navegação de página" class="mt-4">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${navPage.currentPage == 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/colegiado/list(page=${navPage.currentPage - 1})}">Anterior</a>
                        </li>

                        <li th:each="pageNum : ${#numbers.sequence(1, navPage.totalPages)}" 
                            class="page-item" th:classappend="${pageNum == navPage.currentPage} ? 'active'">
                            <a class="page-link" th:href="@{/admin/colegiado/list(page=${pageNum})}" th:text="${pageNum}"></a>
                        </li>

                        <li class="page-item" th:classappend="${navPage.currentPage == navPage.totalPages} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/colegiado/list(page=${navPage.currentPage + 1})}">Próximo</a>
                        </li>
                    </ul>
                </nav>

            </div>
        </div>
    </div>

</body>
</html>
