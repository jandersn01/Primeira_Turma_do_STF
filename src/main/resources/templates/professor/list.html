<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Lista de Professores</title>
</head>
<body>

    <div layout:fragment="conteudo">
        <div class="card mt-4">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Professores Cadastrados</h4>
                <a th:href="@{/admin/professor/form}" class="btn btn-light btn-sm">Novo Professor</a>
            </div>
            
            <div class="card-body">
                
                <div th:if="${mensagem}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${mensagem}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Matricula</th>
                                <th>Curso</th>
                                <th class="text-center">Coord?</th>
                                <th>Fone</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="professor : ${professores}">
                                <td th:text="${professor.id}">1</td>
                                
                                <td>
                                    <a th:href="@{/admin/professor/id/{id}(id=${professor.id})}" 
                                       th:text="${professor.nome}" class="text-decoration-none fw-bold">Nome</a>
                                </td>
                                
                                <td th:text="${professor.matricula}">admin</td>
                                <td th:text="${professor.curso != null ? professor.curso.nome : '—'}">Curso</td>
                                
                                <td class="text-center">
                                    <span th:if="${professor.coordenador}" class="badge bg-success">Sim</span>
                                    <span th:unless="${professor.coordenador}" class="badge bg-secondary">Não</span>
                                </td>
                                <td th:text="${professor.fone}">(83) 9999-9999</td>
                                <td>
                                    <div class="d-flex gap-2">
                                        <a th:href="@{/admin/professor/id/{id}(id=${professor.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                                        <form th:action="@{/admin/professor/delete/{matricula}(matricula=${professor.matricula})}"
                                            method="post" style="display: inline;"
                                            onsubmit="return confirm('Tem certeza que deseja excluir este Professor?');">
                                            <input type="hidden" name="_method" value="delete">
                                            <button class="btn btn-sm btn-outline-danger">Excluir</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            
                            <tr th:if="${#lists.isEmpty(professores)}">
                                <td colspan="7" class="text-center text-muted py-3">Nenhum professor cadastrado.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <nav th:if="${navPage != null and navPage.totalPages > 1}" aria-label="Navegação de página" class="mt-4">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${navPage.currentPage == 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/professor/list(page=${navPage.currentPage - 1})}">Anterior</a>
                        </li>

                        <li th:each="pageNum : ${#numbers.sequence(1, navPage.totalPages)}" 
                            class="page-item" th:classappend="${pageNum == navPage.currentPage} ? 'active'">
                            <a class="page-link" th:href="@{/admin/professor/list(page=${pageNum})}" th:text="${pageNum}"></a>
                        </li>

                        <li class="page-item" th:classappend="${navPage.currentPage == navPage.totalPages} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/professor/list(page=${navPage.currentPage + 1})}">Próximo</a>
                        </li>
                    </ul>
                </nav>

            </div>
        </div>
    </div>

</body>
</html>
