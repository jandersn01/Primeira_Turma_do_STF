spring.application.name=primeiraturmadostf
server.servlet.context-path=/primeiraturmadostf

# Encoding UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.datasource.url=${DB_URL}

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Encoding da conexao com o banco
spring.datasource.hikari.connection-init-sql=SET client_encoding = 'UTF8'

# Dialeto PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Gerenciamento do schema
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update

# Mostra os SQLs no console 
spring.jpa.show-sql=true

# Formata os SQLs (mais legível)
spring.jpa.properties.hibernate.format_sql=true

# Mostra os valores dos parâmetros nas queries
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Configuração de upload de arquivos
# Apenas PDF com máximo de 5MB conforme RF
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.file-size-threshold=2KB

# Diretório de upload (será criado automaticamente)
app.upload.dir=uploads
