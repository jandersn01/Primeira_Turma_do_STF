version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: primeiraturmadostf-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: primeiraturmadostf
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      LANG: pt_BR.UTF-8
      LC_ALL: C.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "client_encoding=UTF8"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d primeiraturmadostf"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
